name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers for adapter tests
        run: npx playwright install --with-deps chromium

      - name: Record evaluated commit
        run: echo "$GITHUB_SHA" > ci-commit.txt

      - name: TypeScript
        run: npm run build

      - name: PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run db:migrate

      - name: Unit and application tests
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm test

      - name: Publish quality evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-quality-evidence-${{ github.sha }}
          path: ci-commit.txt
          if-no-files-found: error

  bdd:
    name: BDD acceptance tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: BDD
        run: npm run test:bdd

  browser:
    name: Playwright E2E
    needs: bdd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:browser

      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-evidence-${{ github.sha }}
          path: |
            artifacts/
            test-results/
            playwright-report/
          if-no-files-found: ignore

  quality-gate:
    name: Quality gate
    needs: [quality, bdd, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Quality gate passed
        run: echo "All mandatory CI gates passed for $GITHUB_SHA"
