name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Security audit
        run: npm audit --audit-level=high

  quality:
    name: TypeScript and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: spike
          POSTGRES_PASSWORD: spike
          POSTGRES_DB: spike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spike -d spike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers for adapter tests
        run: npx playwright install --with-deps chromium
      - name: Record evaluated commit
        run: echo "$GITHUB_SHA" > ci-commit.txt
      - name: TypeScript
        run: npm run build
      - name: PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://spike:spike@127.0.0.1:5432/spike
        run: npm run db:migrate
      - name: Unit and application tests
        env:
          NODE_ENV: test
          TARGET_TIMEOUT_MS: 5000
          DATABASE_URL: postgresql://spike:spike@127.0.0.1:5432/spike
        run: npm test
      - name: Publish quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-quality-evidence-${{ github.sha }}
          path: ci-commit.txt
          if-no-files-found: error

  bdd:
    name: BDD acceptance tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: BDD
        run: npm run test:bdd

  browser:
    name: Playwright E2E
    needs: bdd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:browser
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence-${{ github.sha }}
          path: |
            artifacts/
            test-results/
            playwright-report/
          if-no-files-found: ignore

  public-discovery:
    name: Public SUT discovery (${{ matrix.target }})
    needs: browser
    if: ${{ always() && needs.browser.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: chatbot-sample-page
            config: examples/browser-sut-chatbot-sample.json
          - target: candordesk-demo
            config: examples/browser-sut-candordesk.json
          - target: sitemind-demo
            config: examples/browser-sut-sitemind.json
          - target: querywing-demo
            config: examples/browser-sut-querywing.json
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run provider-neutral discovery
        env:
          BROWSER_SUT_CONFIG_FILE: ${{ matrix.config }}
          BROWSER_SUT_DISCOVERY_REPORT_FILE: artifacts/public-sut-discovery/${{ matrix.target }}.json
          BROWSER_SUT_OUTPUT_FILE: artifacts/public-sut-discovery/${{ matrix.target }}-observations.json
          BROWSER_SUT_EVIDENCE_DIRECTORY: artifacts/public-sut-discovery/${{ matrix.target }}-evidence
          BROWSER_SUT_TIMEOUT_MS: 30000
        run: npm run browser:discovery:run
      - name: Publish public SUT evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-sut-discovery-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/public-sut-discovery/
          if-no-files-found: warn

  public-discovery-aggregate:
    name: Aggregate public locator candidate registry
    needs: public-discovery
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare public discovery evidence directory
        run: mkdir -p artifacts/public-sut-discovery
      - name: Download public discovery evidence
        uses: actions/download-artifact@v8
        with:
          pattern: public-sut-discovery-*-*
          path: artifacts/public-sut-discovery
          merge-multiple: true
      - name: Build cumulative locator candidate registry
        run: npm run browser:discovery:merge -- artifacts/public-sut-discovery artifacts/public-sut-discovery/locator-candidate-registry.json
      - name: Publish cumulative registry
        uses: actions/upload-artifact@v7
        with:
          name: public-sut-locator-candidate-registry-${{ github.sha }}
          path: artifacts/public-sut-discovery/locator-candidate-registry.json
          if-no-files-found: error

  quality-gate:
    name: Quality gate
    needs: [security, quality, bdd, browser]
    if: ${{ always() && needs.security.result == 'success' && needs.quality.result == 'success' && needs.bdd.result == 'success' && needs.browser.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Quality gate passed
        run: echo "All mandatory CI gates passed for $GITHUB_SHA"
