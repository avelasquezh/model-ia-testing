name: Adaptive Discovery Benchmark

on:
  push:
    branches:
      - feat/adaptive-discovery-parallel
  workflow_dispatch:
    inputs:
      corpus:
        description: 'Public SUT corpus path'
        required: false
        default: 'examples/public-sut-discovery-corpus.json'
        type: string
      timeout_ms:
        description: 'Per-target benchmark timeout in milliseconds'
        required: false
        default: '30000'
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run legacy vs adaptive benchmark
        env:
          DISCOVERY_BENCHMARK_CORPUS: ${{ inputs.corpus }}
          DISCOVERY_BENCHMARK_TIMEOUT_MS: ${{ inputs.timeout_ms }}
        run: npm run browser:discovery:benchmark

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adaptive-discovery-benchmark
          path: artifacts/browser-sut/adaptive-discovery-benchmark.json
          if-no-files-found: warn
          retention-days: 14
