name: Apply Adaptive race fix

on:
  push:
    branches: [feat/adaptive-discovery-parallel]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix(chat): make element comparison detached-safe') && !contains(github.event.head_commit.message, 'chore(ci): remove one-shot adaptive race fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-discovery-parallel
          fetch-depth: 1
      - name: Patch detached-safe element comparison
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/infrastructure/execution/playwright/PlaywrightChatDiscovery.ts')
          text = path.read_text()
          old = '''  private async sameElement(left: Locator, right: Locator): Promise<boolean> {\n    const handle = await left.elementHandle();\n    if (!handle) return false;\n    return right.evaluateAll((nodes, selected) => nodes.some((node) => node === selected), handle);\n  }'''
          new = '''  private async sameElement(left: Locator, right: Locator): Promise<boolean> {\n    const handle = await left.elementHandle({ timeout: 0 }).catch(() => null);\n    if (!handle) return false;\n\n    try {\n      return await right.evaluateAll((nodes, selected) => nodes.some((node) => node === selected), handle);\n    } catch {\n      // The candidate may be detached while the page re-renders. Treat it as non-matching.\n      return false;\n    }\n  }'''
          if old not in text:
              raise SystemExit('expected sameElement implementation not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify targeted tests
        run: |
          npm ci
          npx playwright test src/infrastructure/execution/playwright/PlaywrightChatDiscovery.test.ts --project=chromium
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/infrastructure/execution/playwright/PlaywrightChatDiscovery.ts
          git commit -m 'fix(chat): make element comparison detached-safe'
          git push origin feat/adaptive-discovery-parallel
