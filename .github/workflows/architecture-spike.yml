name: Architecture Spike

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: spike
          POSTGRES_PASSWORD: spike
          POSTGRES_DB: spike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spike -d spike"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: SPIKE-001 TypeScript
        run: npm run build

      - name: SPIKE-002/003/006/010/011/012 Unit and architecture tests
        env:
          NODE_ENV: test
          TARGET_TIMEOUT_MS: 5000
          DATABASE_URL: postgresql://spike:spike@localhost:5432/spike
        run: npm test

      - name: SPIKE-004 BDD Cucumber
        run: npm run test:bdd

      - name: SPIKE-005 Playwright
        run: npm run test:browser

      - name: SPIKE-007 PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://spike:spike@localhost:5432/spike
        run: npm run db:migrate

      - name: SPIKE-007 PostgreSQL repository boundary
        env:
          DATABASE_URL: postgresql://spike:spike@localhost:5432/spike
        run: npm test -- spike/persistence/PostgresMigration.test.ts spike/persistence/PostgresExecutionRepository.test.ts spike/persistence/PostgresExecutionEvidenceRepository.test.ts

      - name: Publish test artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: architecture-spike-evidence
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore

      - name: Quality gate
        run: echo "Architecture spike quality gate passed"
