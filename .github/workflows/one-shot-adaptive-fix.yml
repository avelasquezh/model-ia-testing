name: One-shot Adaptive fix
on:
  push:
    branches:
      - feat/adaptive-discovery-parallel
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix once
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%s | grep -Fq 'fix(chat): make element comparison detached-safe'; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('src/infrastructure/execution/playwright/PlaywrightChatDiscovery.ts')
          s = p.read_text()
          old = """  private async sameElement(left: Locator, right: Locator): Promise<boolean> {\n    const handle = await left.elementHandle();\n    if (!handle) return false;\n    return right.evaluateAll((nodes, selected) => nodes.some((node) => node === selected), handle);\n  }"""
          new = """  private async sameElement(left: Locator, right: Locator): Promise<boolean> {\n    const handle = await left.elementHandle({ timeout: 0 }).catch(() => null);\n    if (!handle) return false;\n\n    try {\n      return await right.evaluateAll((nodes, selected) => nodes.some((node) => node === selected), handle);\n    } catch {\n      // A candidate can detach during a reactive re-render; it is not a match anymore.\n      return false;\n    }\n  }"""
          if old not in s:
              raise SystemExit('expected sameElement implementation not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/infrastructure/execution/playwright/PlaywrightChatDiscovery.ts
          git commit -m 'fix(chat): make element comparison detached-safe'
          git push origin feat/adaptive-discovery-parallel
